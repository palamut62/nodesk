<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6d8"/>
      <stop offset="100%" stop-color="#f6e9a8"/>
    </linearGradient>
  </defs>

  <!-- Paper -->
  <rect x="20" y="20" width="1560" height="380" rx="18" fill="url(#paper)" stroke="#e8d77d" stroke-width="1"/>

  <!-- Folded corner -->
  <path d="M 1530 400 L 1580 350 L 1580 400 Z" fill="#e8d77d" opacity="0.55"/>
  <path d="M 1530 400 L 1580 350" stroke="#c8b35c" stroke-width="1" opacity="0.5"/>

  <!-- Notebook lines -->
  <g stroke="#e6d375" stroke-width="1" opacity="0.5">
    <line x1="80" y1="90"  x2="1540" y2="90"/>
    <line x1="80" y1="130" x2="1540" y2="130"/>
    <line x1="80" y1="170" x2="1540" y2="170"/>
    <line x1="80" y1="210" x2="1540" y2="210"/>
    <line x1="80" y1="250" x2="1540" y2="250"/>
    <line x1="80" y1="290" x2="1540" y2="290"/>
    <line x1="80" y1="330" x2="1540" y2="330"/>
    <line x1="80" y1="370" x2="1540" y2="370"/>
  </g>

  <!-- Top URL -->
  <text x="800" y="60" text-anchor="middle" font-size="20" fill="#6b5f48" font-weight="500">github.com/palamut62/nodesk</text>

  <!-- Wordmark -->
  <text x="800" y="200" text-anchor="middle" font-size="150" font-weight="700" fill="#2a2620" letter-spacing="-3">nodesk</text>

  <!-- Tagline -->
  <text x="800" y="245" text-anchor="middle" font-size="22" fill="#2a2620" font-weight="600">
    Always-on-top desktop notes — voice, AI, screenshots, video editor.
  </text>

  <!-- Feature chips -->
  <g font-size="15" font-weight="600" fill="#2a2620">
    <g transform="translate(420,285)">
      <rect width="120" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="60" y="22" text-anchor="middle">📝 Notes</text>
    </g>
    <g transform="translate(550,285)">
      <rect width="110" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="55" y="22" text-anchor="middle">🎙 Voice</text>
    </g>
    <g transform="translate(670,285)">
      <rect width="80" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="40" y="22" text-anchor="middle">✨ AI</text>
    </g>
    <g transform="translate(760,285)">
      <rect width="130" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="65" y="22" text-anchor="middle">📸 Capture</text>
    </g>
    <g transform="translate(900,285)">
      <rect width="110" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="55" y="22" text-anchor="middle">🎬 Video</text>
    </g>
    <g transform="translate(1020,285)">
      <rect width="100" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="50" y="22" text-anchor="middle">🔍 OCR</text>
    </g>
    <g transform="translate(1130,285)">
      <rect width="120" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="60" y="22" text-anchor="middle">📋 Clipboard</text>
    </g>
  </g>

  <!-- Stack -->
  <text x="800" y="355" text-anchor="middle" font-size="16" fill="#6b5f48" letter-spacing="2" font-weight="500">
    TAURI · RUST · REACT · TYPESCRIPT
  </text>

  <!-- Footer -->
  <text x="800" y="392" text-anchor="middle" font-size="13" fill="#8a7c5e">
    by palamut62 · MIT licensed
  </text>
</svg>

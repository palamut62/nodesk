<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6d8"/>
      <stop offset="100%" stop-color="#f6e9a8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Paper -->
  <rect x="20" y="20" width="1160" height="440" rx="18" fill="url(#paper)" stroke="#e8d77d" stroke-width="1"/>

  <!-- Folded corner -->
  <path d="M 1130 460 L 1180 410 L 1180 460 Z" fill="#e8d77d" opacity="0.55"/>
  <path d="M 1130 460 L 1180 410" stroke="#c8b35c" stroke-width="1" opacity="0.5"/>

  <!-- Notebook lines -->
  <g stroke="#e6d375" stroke-width="1" opacity="0.55">
    <line x1="120" y1="100" x2="1140" y2="100"/>
    <line x1="120" y1="140" x2="1140" y2="140"/>
    <line x1="120" y1="180" x2="1140" y2="180"/>
    <line x1="120" y1="220" x2="1140" y2="220"/>
    <line x1="120" y1="260" x2="1140" y2="260"/>
    <line x1="120" y1="300" x2="1140" y2="300"/>
    <line x1="120" y1="340" x2="1140" y2="340"/>
    <line x1="120" y1="380" x2="1140" y2="380"/>
    <line x1="120" y1="420" x2="1140" y2="420"/>
  </g>

  <!-- Spiral binding -->
  <g>
    <rect x="60" y="40" width="40" height="400" rx="6" fill="#f0e08c" stroke="#d6c067" stroke-width="1"/>
    <g fill="#fff8d6" stroke="#a89548" stroke-width="1.2">
      <circle cx="80" cy="70"  r="8"/>
      <circle cx="80" cy="115" r="8"/>
      <circle cx="80" cy="160" r="8"/>
      <circle cx="80" cy="205" r="8"/>
      <circle cx="80" cy="250" r="8"/>
      <circle cx="80" cy="295" r="8"/>
      <circle cx="80" cy="340" r="8"/>
      <circle cx="80" cy="385" r="8"/>
      <circle cx="80" cy="425" r="8"/>
    </g>
  </g>

  <!-- Top URL -->
  <text x="600" y="68" text-anchor="middle" font-size="20" fill="#6b5f48" font-weight="500">github.com/palamut62/nodesk</text>

  <!-- Wordmark -->
  <text x="620" y="220" text-anchor="middle" font-size="140" font-weight="700" fill="#2a2620" letter-spacing="-3">nodesk</text>

  <!-- Tagline -->
  <text x="620" y="265" text-anchor="middle" font-size="22" fill="#2a2620" font-weight="600">
    Always-on-top desktop notes — voice, AI, screenshots, video editor.
  </text>

  <!-- Feature chips -->
  <g font-size="15" font-weight="600" fill="#2a2620">
    <g transform="translate(280,310)">
      <rect width="120" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="60" y="22" text-anchor="middle">📝 Notes</text>
    </g>
    <g transform="translate(410,310)">
      <rect width="110" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="55" y="22" text-anchor="middle">🎙 Voice</text>
    </g>
    <g transform="translate(530,310)">
      <rect width="80" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="40" y="22" text-anchor="middle">✨ AI</text>
    </g>
    <g transform="translate(620,310)">
      <rect width="120" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="60" y="22" text-anchor="middle">📸 Capture</text>
    </g>
    <g transform="translate(750,310)">
      <rect width="110" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="55" y="22" text-anchor="middle">🎬 Video</text>
    </g>
    <g transform="translate(870,310)">
      <rect width="100" height="34" rx="17" fill="#f5b700" stroke="#e09e00"/>
      <text x="50" y="22" text-anchor="middle">🔍 OCR</text>
    </g>
  </g>

  <!-- Stack -->
  <text x="620" y="395" text-anchor="middle" font-size="16" fill="#6b5f48" letter-spacing="1.5" font-weight="500">
    TAURI · RUST · REACT · TYPESCRIPT
  </text>

  <!-- Footer -->
  <text x="620" y="438" text-anchor="middle" font-size="13" fill="#8a7c5e">
    by palamut62 · MIT licensed
  </text>
</svg>
